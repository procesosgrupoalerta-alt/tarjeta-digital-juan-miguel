<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#111111">

  <meta
    name="description"
    content="Tarjeta digital de Juan Miguel Estrada, Gerente de Planta de Grupo Alerta."
  >

  <title>Juan Miguel Estrada | Grupo Alerta</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="page-wrapper">

    <article class="digital-card">

      <!-- =========================
           CABECERA CORPORATIVA
      ========================== -->
      <header class="hero">

        <div class="brand-header">

          <img
            src="assets/logo-alerta.png"
            alt="Grupo Alerta"
            class="logo-alerta"
          >

          <div class="brand-divider"></div>

          <img
            src="assets/logo-80-anios.png"
            alt="80 años Grupo Alerta"
            class="logo-80"
          >

        </div>

        <div class="red-area">

          <div class="decor decor-1"></div>
          <div class="decor decor-2"></div>
          <div class="decor decor-3"></div>

        </div>

        <div class="profile-picture-wrapper">

          <img
            src="assets/foto-juan-miguel.jpg"
            alt="Juan Miguel Estrada"
            class="profile-picture"
          >

        </div>

      </header>


      <!-- =========================
           INFORMACIÓN PERSONAL
      ========================== -->
      <section class="profile-info">

        <h1 id="nombre">Juan Miguel Estrada</h1>

        <h2 id="puesto">Gerente de Planta</h2>

        <p class="company" id="empresa">
          Grupo Alerta
        </p>

        <div class="title-line"></div>

        <p class="tagline">
          Conectando operaciones y resultados
        </p>


        <!-- =========================
             ACCESOS RÁPIDOS
        ========================== -->
        <div class="quick-actions">

          <!-- LLAMAR -->
          <a
            id="btnCall"
            class="quick-action"
            href="#"
            aria-label="Llamar a Juan Miguel Estrada"
          >

            <span class="action-circle red">

              <svg viewBox="0 0 24 24">
                <path
                  d="M22 16.92v3a2 2 0 0 1-2.18 2
                  19.79 19.79 0 0 1-8.63-3.07
                  19.5 19.5 0 0 1-6-6
                  19.79 19.79 0 0 1-3.07-8.67
                  A2 2 0 0 1 4.11 2h3
                  a2 2 0 0 1 2 1.72
                  c.12.9.33 1.78.62 2.63
                  a2 2 0 0 1-.45 2.11
                  L8 9.73
                  a16 16 0 0 0 6 6
                  l1.27-1.27
                  a2 2 0 0 1 2.11-.45
                  c.85.29 1.73.5 2.63.62
                  A2 2 0 0 1 22 16.92z"
                />
              </svg>

            </span>

            <span>Llamar</span>

          </a>


          <!-- WHATSAPP -->
          <a
            id="btnWhatsapp"
            class="quick-action"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Contactar por WhatsApp"
          >

            <span class="action-circle whatsapp">

              <svg viewBox="0 0 24 24">
                <path
                  d="M21 11.5a8.38 8.38 0 0 1-.9 3.8
                  8.5 8.5 0 0 1-7.6 4.7
                  8.38 8.38 0 0 1-3.8-.9
                  L3 21l1.9-5.7
                  a8.38 8.38 0 0 1-.9-3.8
                  8.5 8.5 0 0 1 4.7-7.6
                  8.38 8.38 0 0 1 3.8-.9h.5
                  A8.48 8.48 0 0 1 21 11z"
                />
                <path
                  d="M8.5 8.5c.5 3 2 4.5 5 5"
                />
              </svg>

            </span>

            <span>WhatsApp</span>

          </a>


          <!-- CORREO -->
          <a
            id="btnEmail"
            class="quick-action"
            href="#"
            aria-label="Enviar correo"
          >

            <span class="action-circle red">

              <svg viewBox="0 0 24 24">
                <path d="M3 5h18v14H3z"/>
                <path d="m3 6 9 7 9-7"/>
              </svg>

            </span>

            <span>Correo</span>

          </a>


          <!-- WEB -->
          <a
            id="btnWeb"
            class="quick-action"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Abrir sitio web"
          >

            <span class="action-circle dark">

              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18"/>
                <path d="M12 3a15 15 0 0 1 0 18"/>
                <path d="M12 3a15 15 0 0 0 0 18"/>
              </svg>

            </span>

            <span>Sitio web</span>

          </a>

        </div>


        <!-- =========================
             TARJETA DE DATOS
        ========================== -->
        <div class="contact-card">

          <!-- CORREO -->
          <a
            id="emailRow"
            class="contact-row"
            href="#"
          >

            <div class="row-icon">

              <svg viewBox="0 0 24 24">
                <path d="M3 5h18v14H3z"/>
                <path d="m3 6 9 7 9-7"/>
              </svg>

            </div>

            <div class="row-content">

              <small>Correo</small>

              <strong id="email">
                jestrada@alerta.com.mx
              </strong>

            </div>

            <span class="arrow">›</span>

          </a>


          <!-- UBICACIÓN -->
          <a
            id="locationRow"
            class="contact-row"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          >

            <div class="row-icon">

              <svg viewBox="0 0 24 24">
                <path
                  d="M20 10c0 5-8 12-8 12S4 15 4 10
                  a8 8 0 1 1 16 0z"
                />
                <circle cx="12" cy="10" r="2.5"/>
              </svg>

            </div>

            <div class="row-content">

              <small>Ubicación</small>

              <strong id="ubicacion">
                Mazatlán, Sinaloa
              </strong>

            </div>

            <span class="arrow">›</span>

          </a>


          <!-- WEB -->
          <a
            id="webRow"
            class="contact-row"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          >

            <div class="row-icon">

              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18"/>
                <path d="M12 3a15 15 0 0 1 0 18"/>
                <path d="M12 3a15 15 0 0 0 0 18"/>
              </svg>

            </div>

            <div class="row-content">

              <small>Página</small>

              <strong id="web">
                www.alerta.com.mx
              </strong>

            </div>

            <span class="arrow">›</span>

          </a>


          <!-- TELÉFONO -->
          <a
            id="phoneRow"
            class="contact-row"
            href="#"
          >

            <div class="row-icon">

              <svg viewBox="0 0 24 24">
                <path
                  d="M22 16.92v3a2 2 0 0 1-2.18 2
                  19.79 19.79 0 0 1-8.63-3.07
                  19.5 19.5 0 0 1-6-6
                  19.79 19.79 0 0 1-3.07-8.67
                  A2 2 0 0 1 4.11 2h3
                  a2 2 0 0 1 2 1.72"
                />
              </svg>

            </div>

            <div class="row-content">

              <small>Teléfono</small>

              <strong id="telefono">
                +52 669 120 0175
              </strong>

            </div>

            <span class="arrow">›</span>

          </a>

        </div>


        <!-- =========================
             BOTONES INFERIORES
        ========================== -->
        <div class="bottom-actions">

          <button
            id="saveContact"
            class="primary-button"
            type="button"
          >

            <svg viewBox="0 0 24 24">
              <path d="M12 3v12"/>
              <path d="m7 10 5 5 5-5"/>
              <path d="M5 20h14"/>
            </svg>

            <span>Guardar contacto</span>

          </button>


          <button
            id="shareContact"
            class="secondary-button"
            type="button"
          >

            <svg viewBox="0 0 24 24">
              <circle cx="18" cy="5" r="2"/>
              <circle cx="6" cy="12" r="2"/>
              <circle cx="18" cy="19" r="2"/>
              <path d="m8 11 8-5"/>
              <path d="m8 13 8 5"/>
            </svg>

            <span>Compartir</span>

          </button>

        </div>

      </section>

    </article>

  </main>


  <!-- =========================
       MODAL COPIAR ENLACE
  ========================== -->
  <div
    id="shareFallback"
    class="modal-overlay"
    aria-hidden="true"
  >

    <div class="modal-card">

      <button
        id="closeModal"
        class="modal-close"
        type="button"
        aria-label="Cerrar"
      >
        ×
      </button>

      <h3>Compartir tarjeta</h3>

      <p>
        Copia el enlace de la tarjeta:
      </p>

      <input
        id="shareUrlInput"
        type="text"
        readonly
      >

      <button
        id="copyUrlButton"
        class="primary-button modal-copy"
        type="button"
      >
        Copiar enlace
      </button>

    </div>

  </div>


  <!-- NOTIFICACIÓN -->
  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>


  <script src="script.js"></script>

</body>
</html>
